<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Siege — Physics Destruction</title>
<style>
  :root{
    --ink:#eaf4ff;
    --panel:rgba(10,14,28,0.55);
    --edge:rgba(255,255,255,0.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#07070d;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);user-select:none}
  #game{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
  #ui{position:fixed;inset:0;pointer-events:none}

  #topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--edge);
    padding:9px 15px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.3px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 6px 22px rgba(0,0,0,.35);white-space:nowrap;
  }
  #score{color:#ffe08a;font-variant-numeric:tabular-nums}
  #lvl{color:#bfe9ff}
  #shots{color:#d6ffd6}
  #ammo{color:#bfe9ff;pointer-events:auto;cursor:pointer;transition:transform .12s ease,color .2s}
  #ammo:hover{transform:translateY(-1px)}
  #ammo.bomb{color:#ffb15c;border-color:rgba(255,177,92,.5)}
  .spacer{flex:1}

  button{font-family:inherit;color:var(--ink);cursor:pointer;border:0;background:none}
  .btn{
    background:var(--panel);border:1px solid var(--edge);padding:9px 16px;border-radius:999px;
    font-weight:700;font-size:14px;pointer-events:auto;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 6px 22px rgba(0,0,0,.35);transition:transform .12s ease,background .2s
  }
  .btn:hover{transform:translateY(-1px);background:rgba(30,40,70,.7)}
  .btn:active{transform:translateY(0)}

  #hint{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--edge);padding:10px 18px;border-radius:999px;
    font-size:14px;font-weight:600;color:#dbe9ff;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity .4s ease;text-align:center;max-width:92vw;
  }

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(12,16,34,.55),rgba(4,5,12,.86));
    opacity:0;pointer-events:none;transition:opacity .35s ease;padding:20px}
  #overlay.show{opacity:1;pointer-events:auto}

  .card{
    width:min(560px,92vw);background:linear-gradient(180deg,rgba(20,26,48,.94),rgba(10,13,26,.96));
    border:1px solid var(--edge);border-radius:26px;padding:34px 30px;text-align:center;
    box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
    animation:pop .4s cubic-bezier(.2,.9,.3,1.2)
  }
  @keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:none;opacity:1}}

  .logo{font-size:52px;font-weight:900;letter-spacing:2px;line-height:1;
    background:linear-gradient(90deg,#9df1ff,#ffe08a,#ff9de0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(120,220,255,.35))}
  .logo span{display:block;font-size:30px;letter-spacing:9px;margin-top:2px;
    background:linear-gradient(90deg,#ffe08a,#ff9de0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:14px 0 22px;color:#c3d2ee;font-size:15px;line-height:1.5}
  .keys{margin-top:18px;font-size:12.5px;color:#93a4c6;line-height:1.7}
  .keys b{color:#cfe0ff}

  .banner{font-size:30px;font-weight:900;letter-spacing:3px;
    background:linear-gradient(90deg,#9df1ff,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card.lose .banner{background:linear-gradient(90deg,#ff9d7d,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:8px;color:#b9c8e6;font-size:15px;font-weight:600}
  .stats{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:14px;padding:12px 18px}
  .stats span{color:#9fb0d0;font-size:13px;text-transform:uppercase;letter-spacing:1px}
  .stats b{font-size:26px;color:#ffe08a;font-variant-numeric:tabular-nums}
  .bonus{margin-top:10px;color:#7dffb0;font-weight:700;font-size:14px}

  .row{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .big{
    background:linear-gradient(180deg,#3aa0ff,#2568d6);border:1px solid rgba(255,255,255,.28);
    padding:14px 30px;border-radius:999px;font-weight:800;font-size:17px;letter-spacing:.5px;
    box-shadow:0 10px 30px rgba(40,120,255,.4);transition:transform .12s ease,filter .2s
  }
  .big:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .big:active{transform:translateY(0)}
  .ghost{background:rgba(255,255,255,.07);border:1px solid var(--edge);padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px}
  .ghost:hover{background:rgba(255,255,255,.13)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="topbar">
    <div class="pill" id="lvl">Level 1</div>
    <div class="pill" id="score">0</div>
    <div class="pill" id="shots">Shots 0</div>
    <div class="pill" id="ammo">● Nova</div>
    <div class="spacer"></div>
    <button class="btn" id="btnRestart">↻ Restart</button>
  </div>
  <div id="hint">Drag back from Nova to aim — release to launch</div>
  <div id="overlay"></div>
</div>

  function blockBody(spec) {

      density: mat.dens, angle: spec.a, slop: 0.02

    body.gameData = {
      type: spec.t, w: spec.w, h: spec.h, hp: mat.hp, maxHp: mat.hp,
      pts: mat.pts, target: !!mat.target, tnt: !!mat.tnt,

  function buildWorld(engine, levelIndex) {

    var statics = [];
    var ground = Bodies.rectangle(VW / 2, GROUND_Y + 120, VW + 400, 240, {
      isStatic: true, friction: 0.9, restitution: 0.05
    });
    ground.label = 'ground';
    statics.push(ground);
    var wallL = Bodies.rectangle(-60, VH / 2, 120, VH * 3, { isStatic: true });
    var wallR = Bodies.rectangle(VW + 60, VH / 2, 120, VH * 3, { isStatic: true });
    statics.push(wallL, wallR);
    Composite.add(engine.world, statics);

    var blocks = [];
    for (var i = 0; i < lvl.blocks.length; i++) {

      blocks.push(b);

    }

  /* ---------------- audio (tiny synth) ---------------- */
  var AC = null;
  function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
  function sfx(type) {
    var ac = actx(); if (!ac) { return; }
    var t = ac.currentTime;
    if (type === 'launch') {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(620, t + 0.18);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.24);
    } else if (type === 'hit') {
      var o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = 'square'; o2.frequency.setValueAtTime(140, t); o2.frequency.exponentialRampToValueAtTime(60, t + 0.12);
      g2.gain.setValueAtTime(0.09, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o2.connect(g2); g2.connect(ac.destination); o2.start(t); o2.stop(t + 0.15);
    } else if (type === 'boom') {
      var buf = ac.createBuffer(1, 4410, 44100), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.4); }
      var src = ac.createBufferSource(); src.buffer = buf;
      var g3 = ac.createGain(); g3.gain.setValueAtTime(0.5, t); g3.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t);
      src.connect(lp); lp.connect(g3); g3.connect(ac.destination); src.start(t);
    } else if (type === 'win') {
      [523, 659, 784, 1046].forEach(function (f, i) {
        var oo = ac.createOscillator(), gg = ac.createGain();
        oo.type = 'triangle'; oo.frequency.value = f;
        gg.gain.setValueAtTime(0.0001, t + i * 0.11);
        gg.gain.exponentialRampToValueAtTime(0.16, t + i * 0.11 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.3);
        oo.connect(gg); gg.connect(ac.destination); oo.start(t + i * 0.11); oo.stop(t + i * 0.11 + 0.32);
      });
    } else if (type === 'lose') {
      [392, 330, 262].forEach(function (f, i) {
        var oo = ac.createOscillator(), gg = ac.createGain();
        oo.type = 'sine'; oo.frequency.value = f;
        gg.gain.setValueAtTime(0.0001, t + i * 0.16);
        gg.gain.exponentialRampToValueAtTime(0.15, t + i * 0.16 + 0.03);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 0.4);
        oo.connect(gg); gg.connect(ac.destination); oo.start(t + i * 0.16); oo.stop(t + i * 0.16 + 0.42);
      });
    }
  }

  /* ---------------- destruction ---------------- */
  function hurt(body, dmg) {
    var d = body.gameData;

    d.hp -= dmg;

    if (d.hp <= 0) { destroy(body); }

  function destroy(body) {
    var d = body.gameData;
    if (!d.alive) { return; }
    d.alive = false;
    var p = body.position;
    Composite.remove(world, body);

    var colors = { wood: '#c08a4a', stone: '#a7b0ba', armor: '#5b6470', crystal: '#7de9ff', tnt: '#ff7a5c' };
    var col = colors[d.type] || '#cccccc';

    if (d.tnt) {
      explode(p.x, p.y, 130, 95, col);
    } else {
      spawnDebris(p.x, p.y, d.w, d.h, col, d.type === 'crystal' ? 22 : 14);
      spawnSparks(p.x, p.y, d.type === 'crystal' ? '#bff6ff' : '#ffd9a0', 14, 6);

    if (G.comboCount >= 2) {
      floatText(p.x, p.y - 46, 'x' + mult.toFixed(1) + ' COMBO', '#ff9de0', true);
    }
    updateHUD();

    if (d.target) {
      spawnRing(p.x, p.y, '#bff6ff', 90);
      G.flash = 0.6;
      if (targetsLeft() === 0) { winLevel(); }

  function explode(x, y, radius, maxDmg, col) {
    sfx('boom');
    G.shake = Math.min(30, G.shake + 22);
    G.flash = 0.9;
    spawnRing(x, y, '#ffb15c', radius);
    spawnRing(x, y, '#ffffff', radius * 0.6);
    spawnSparks(x, y, '#ffd06b', 40, 14);
    spawnSparks(x, y, '#ff7a3c', 26, 10);
    spawnSmoke(x, y, 16);
    spawnDebris(x, y, 20, 20, col, 20);

    var list = Composite.allBodies(world);
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (b.isStatic) { continue; }
      var dx = b.position.x - x, dy = b.position.y - y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > radius || dist < 0.01) { continue; }
      var f = (1 - dist / radius);
      Body.applyForce(b, b.position, { x: (dx / dist) * f * b.mass * 0.045, y: (dy / dist) * f * b.mass * 0.045 - 0.02 * b.mass });
      if (b.gameData && b.gameData.destructible && b.gameData.alive) {

      }
    }

  function impact(target, other) {

    if (rel < 3.2) { return; }
    var otherMass = (other.isStatic || !other.gameData) ? target.mass : other.mass;
    if (other.gameData && other.gameData.kind === 'proj') { otherMass = other.mass; }
    var dmg = (rel - 3.2) * otherMass * 0.5;

  }
  function onMove(e) {
    var p = toWorld(e.clientX, e.clientY);
    G.pointer.x = p.x; G.pointer.y = p.y;
    if (G.pointer.down && G.state === 'aiming') { updateAim(); }
  }
  function onUp() {
    if (!G.pointer.down) { return; }
    G.pointer.down = false;
    if (G.state === 'aiming' && G.aim) {
      var pull = Vector.magnitude(Vector.sub({ x: LAUNCHER.x, y: LAUNCHER.y }, G.aim));
      if (pull > 22) { fire(); }
      else { G.aim = null; }
    }
  }
  function updateAim() {
    var dx = G.pointer.x - LAUNCHER.x, dy = G.pointer.y - LAUNCHER.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var maxPull = 150;
    var clamped = Math.min(len, maxPull);
    /* the pull-back point sits in the direction the player drags;
       the launch direction is the opposite (from pull-back point to anchor) */
    G.aim = { x: LAUNCHER.x + (dx / len) * clamped, y: LAUNCHER.y + (dy / len) * clamped };
  }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', function (e) { if (e.touches[0]) { onDown(e.touches[0]); } e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', function (e) { if (e.touches[0]) { onMove(e.touches[0]); } }, { passive: true });
  window.addEventListener('touchend', function () { onUp(); });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'q' || e.key === 'Q') { toggleAmmo(); }
    if (e.key === 'r' || e.key === 'R') { if (G.state !== 'menu') { startLevel(G.levelIndex); } }
  });

  function toggleAmmo() {
    if (G.state !== 'aiming') { return; }
    G.ammo = G.ammo === 'nova' ? 'bomb' : 'nova';
    updateHUD();
    spawnSparks(LAUNCHER.x, LAUNCHER.y, G.ammo === 'bomb' ? '#ffb15c' : '#9fe8ff', 12, 5);
  }

  document.getElementById('btnRestart').addEventListener('click', function () {
    if (G.state !== 'menu') { startLevel(G.levelIndex); }
  });
  if (hudAmmo) { hudAmmo.addEventListener('click', toggleAmmo); }

  /* ---------------- update ---------------- */
  function update(dt) {
    G.time += dt;
    if (G.shake > 0) { G.shake *= Math.pow(0.001, dt); if (G.shake < 0.2) { G.shake = 0; } }
    if (G.flash > 0) { G.flash = Math.max(0, G.flash - dt * 2.2); }
    if (G.endFlash > 0) { G.endFlash = Math.max(0, G.endFlash - dt); }

    /* blink */
    G.blink -= dt;
    if (G.blink < -0.12) { G.nextBlink = 1.6 + Math.random() * 3; G.blink = G.nextBlink; }

    /* combo timer */
    if (G.comboTimer > 0) { G.comboTimer -= dt; if (G.comboTimer <= 0) { G.comboCount = 0; } }

    /* lightning in night theme */
    if (LEVELS[G.levelIndex].theme === 'night' && G.state !== 'menu') {
      G.lightningTimer -= dt;
      if (G.lightningTimer <= 0) { G.lightning = 0.35; G.lightningTimer = 4 + Math.random() * 6; }
      if (G.lightning > 0) { G.lightning = Math.max(0, G.lightning - dt * 1.6); }
    }

    /* physics stepping (with hitstop) */
    if (G.hitstop > 0) {
      G.hitstop -= dt;
    } else {
      var steps = 2;
      var sub = dt / steps;
      for (var s = 0; s < steps; s++) { Engine.update(engine, sub * 1000); }
    }

    /* projectile handling */
    if (G.proj && G.proj.gameData && G.proj.gameData.alive) {
      var pb = G.proj;
      var sp = Vector.magnitude(pb.velocity);
      /* bomb detonation is handled by the collisionStart listener (checkBomb) */
      if (sp < 1.4) { G.settleTimer += dt; } else { G.settleTimer = 0; }
      if (G.settleTimer > 0.7 || pb.position.y > VH + 200 || pb.position.x > VW + 200 || pb.position.x < -200) {
        removeProjectile(pb);
      }
    }

    /* projectiles list cleanup + trail */
    for (var pi = G.projectiles.length - 1; pi >= 0; pi--) {
      var pp = G.projectiles[pi];
      if (!pp.gameData || !pp.gameData.alive) { G.projectiles.splice(pi, 1); continue; }
      var v = Vector.magnitude(pp.velocity);
      if (v > 6 && Math.random() < 0.9) {
        G.particles.push({
          kind: 'trail', x: pp.position.x, y: pp.position.y, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
          g: -0.02, life: 1, decay: 0.045, size: pp.gameData.r * (0.7 + Math.random() * 0.5),
          color: pp.gameData.bomb ? '255,140,80' : '120,230,255'
        });
      }
    }

    /* particles */
    for (var k = G.particles.length - 1; k >= 0; k--) {
      var pt = G.particles[k];
      pt.life -= pt.decay * (dt * 60) * 0.5 + pt.decay * 0.5;
      if (pt.kind !== 'ring') {
        pt.x += pt.vx * dt * 60; pt.y += pt.vy * dt * 60;
        pt.vy += (pt.g || 0.3) * dt * 60;
        if (pt.kind === 'debris') { pt.rot += pt.vr * dt * 60; }
      } else {
        pt.r += (pt.maxR - pt.r) * dt * 6;
      }
      if (pt.life <= 0) { G.particles.splice(k, 1); }
    }
    if (G.particles.length > 700) { G.particles.splice(0, G.particles.length - 700); }

    /* floaters */
    for (var f = G.floaters.length - 1; f >= 0; f--) {
      var ft = G.floaters[f];
      ft.life -= ft.decay * dt * 60;
      ft.y += ft.vy * dt * 60;
      ft.vy *= 0.96;
      if (ft.life <= 0) { G.floaters.splice(f, 1); }
    }

    /* shot end */
    if (G.state === 'flying') {
      G.shotTime = (G.shotTime || 0) + dt;
      if (G.shotTime > 6 && G.proj) { removeProjectile(G.proj); }
    } else { G.shotTime = 0; }
    if (G.state === 'flying' && G.shotActive && !G.proj) {
      finishShot();
    }

    /* won pause -> show win overlay */
    if (G.state === 'won') {
      G.wonPause -= dt;
      if (G.wonPause <= 0 && !overlay.classList.contains('show')) { showWin(); }
    }
  }

  function removeProjectile(pb) {
    if (pb.gameData) { pb.gameData.alive = false; }
    Composite.remove(world, pb);
    if (G.proj === pb) { G.proj = null; }
    var i = G.projectiles.indexOf(pb);
    if (i >= 0) { G.projectiles.splice(i, 1); }
    spawnSparks(pb.position.x, pb.position.y, '#bff6ff', 8, 3);
  }

  /* bomb detonation on collision */
  Events.on(engine, 'collisionStart', function (ev) {
    for (var i = 0; i < ev.pairs.length; i++) {
      var a = ev.pairs[i].bodyA, b = ev.pairs[i].bodyB;
      checkBomb(a, b); checkBomb(b, a);
    }
  });
  function checkBomb(proj, other) {
    if (!proj.gameData || proj.gameData.kind !== 'proj' || !proj.gameData.bomb || !proj.gameData.armed) { return; }
    proj.gameData.armed = false;
    explode(proj.position.x, proj.position.y, 135, 100, '#ff8c50');
    removeProjectile(proj);
  }

  /* ---------------- draw helpers ---------------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackdrop(th) {
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.sky[0]); g.addColorStop(0.4, th.sky[1]);
    g.addColorStop(0.72, th.sky[2]); g.addColorStop(1, th.sky[3]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    /* stars */
    for (var i = 0; i < G.stars.length; i++) {
      var s = G.stars[i];
      var a = th.stars * (0.4 + 0.6 * Math.abs(Math.sin(G.time * s.sp + s.tw)));
      if (a <= 0.02) { continue; }
      ctx.globalAlpha = Math.min(1, a);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* lightning */
    if (G.lightning > 0.02) {
      ctx.fillStyle = 'rgba(200,220,255,' + (G.lightning * 0.5) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }

    /* sun / moon */
    var sun = th.sun;
    var rg = ctx.createRadialGradient(sun.x, sun.y, 4, sun.x, sun.y, sun.r * 3.4);
    rg.addColorStop(0, sun.glow); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sun.x, sun.y, sun.r * 3.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = sun.c; ctx.beginPath(); ctx.arc(sun.x, sun.y, sun.r, 0, 6.283); ctx.fill();

    /* clouds */
    for (var c = 0; c < G.clouds.length; c++) {
      var cl = G.clouds[c];
      cl.x += cl.v * 0.016;
      if (cl.x > VW + 200) { cl.x = -220; }
      ctx.fillStyle = th.cloud;
      var s2 = cl.s;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, 34 * s2, 0, 6.283);
      ctx.arc(cl.x + 40 * s2, cl.y + 8 * s2, 26 * s2, 0, 6.283);
      ctx.arc(cl.x - 42 * s2, cl.y + 10 * s2, 24 * s2, 0, 6.283);
      ctx.arc(cl.x + 8 * s2, cl.y - 16 * s2, 26 * s2, 0, 6.283);
      ctx.fill();
    }

    /* hills (parallax bands) */
    hill(th.hillA, 470, 90, 0);
    hill(th.hillB, 520, 120, 60);
    hill(th.hillC, 570, 150, 130);
  }
  function hill(color, baseY, amp, off) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VH);
    for (var x = 0; x <= VW; x += 20) {
      var y = baseY - Math.sin((x + off) * 0.006) * amp * 0.4 - Math.sin((x + off) * 0.017) * amp * 0.2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW, VH); ctx.closePath(); ctx.fill();
  }

  function drawGround(th) {
    var g = ctx.createLinearGradient(0, GROUND_Y, 0, VH);
    g.addColorStop(0, th.groundTop); g.addColorStop(0.35, th.groundMid); g.addColorStop(1, th.groundLow);
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND_Y, VW, VH - GROUND_Y);
    /* grass highlight */
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (var x = 0; x <= VW; x += 16) {
      var y = GROUND_Y + Math.sin(x * 0.08) * 1.5;
      if (x === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    /* tufts */
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    for (var i = 0; i < 60; i++) {
      var tx = (i * 37 + 11) % VW;
      ctx.beginPath(); ctx.moveTo(tx, GROUND_Y + 3); ctx.lineTo(tx + 3, GROUND_Y - 6); ctx.stroke();
    }
  }

  function drawBlock(b) {
    var d = b.gameData;
    if (!d || !d.alive) { return; }
    var x = b.position.x, y = b.position.y, a = b.angle;
    var w = d.w, h = d.h;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(a);

    if (d.type === 'crystal') { drawCrystal(d, w, h); }
    else {
      var pal = {
        wood: ['#c58c4e', '#a06a32', '#7d4d20'],
        stone: ['#aab3bd', '#8b95a1', '#6b7583'],
        armor: ['#5d6774', '#434c58', '#2c333d'],
        tnt: ['#e0523c', '#c03a26', '#8f2716']
      }[d.type];
      var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, pal[2]);
      ctx.fillStyle = g;
      rr(-w / 2, -h / 2, w, h, Math.min(6, w / 4, h / 4)); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      /* inner highlight */
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5;
      rr(-w / 2 + 4, -h / 2 + 4, w - 8, h - 8, Math.min(4, w / 5, h / 5)); ctx.stroke();

      if (d.type === 'wood') {
        ctx.strokeStyle = 'rgba(80,45,10,0.35)'; ctx.lineWidth = 1.5;
        var n = Math.max(2, Math.floor(Math.max(w, h) / 22));
        for (var i = 1; i < n; i++) {
          ctx.beginPath();
          if (w >= h) { var xx = -w / 2 + (w / n) * i; ctx.moveTo(xx, -h / 2 + 3); ctx.lineTo(xx, h / 2 - 3); }
          else { var yy = -h / 2 + (h / n) * i; ctx.moveTo(-w / 2 + 3, yy); ctx.lineTo(w / 2 - 3, yy); }
          ctx.stroke();
        }
      } else if (d.type === 'stone') {
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        for (var k = 0; k < 5; k++) {
          var s = Math.abs(Math.sin(d.seed + k * 2.3));
          ctx.beginPath(); ctx.arc(-w / 2 + (w) * ((k + s) / 6), -h / 2 + h * ((s + k) / 7), 1.6 + s * 2, 0, 6.283); ctx.fill();
        }
      } else if (d.type === 'armor') {
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        var pts = [[-w / 2 + 8, -h / 2 + 8], [w / 2 - 8, -h / 2 + 8], [-w / 2 + 8, h / 2 - 8], [w / 2 - 8, h / 2 - 8]];
        for (var q = 0; q < pts.length; q++) { ctx.beginPath(); ctx.arc(pts[q][0], pts[q][1], 3, 0, 6.283); ctx.fill(); }
      } else if (d.type === 'tnt') {
        ctx.fillStyle = 'rgba(255,220,120,0.95)';
        ctx.fillRect(-w / 2, -h * 0.14, w, h * 0.28);
        ctx.fillStyle = '#3a1a10'; ctx.font = 'bold ' + Math.floor(h * 0.34) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('TNT', 0, 1);
        /* fuse */
        ctx.strokeStyle = '#e8d38a'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, -h / 2); ctx.quadraticCurveTo(8, -h / 2 - 10, 2, -h / 2 - 16); ctx.stroke();
      }
    }

    /* damage flash */
    if (d.flash > 0.01) {
      ctx.globalAlpha = d.flash * 0.8;
      ctx.fillStyle = '#ffffff';
      rr(-w / 2, -h / 2, w, h, 5); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawCrystal(d, w, h) {
    var pulse = 1 + Math.sin(G.time * 3 + d.seed) * 0.04;
    ctx.save();
    ctx.scale(pulse, pulse);
    var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, '#d6fbff'); g.addColorStop(0.45, '#7de9ff'); g.addColorStop(1, '#2fa8dd');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 2, -h / 6);
    ctx.lineTo(w / 2, h / 2);
    ctx.lineTo(-w / 2, h / 2);
    ctx.lineTo(-w / 2, -h / 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    /* facet lines */
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -h / 2); ctx.lineTo(0, h / 2); ctx.moveTo(-w / 2, -h / 6); ctx.lineTo(w / 2, -h / 6); ctx.stroke();
    /* glow */
    var rg = ctx.createRadialGradient(0, 0, 2, 0, 0, w * 1.5);
    rg.addColorStop(0, 'rgba(150,240,255,0.35)'); rg.addColorStop(1, 'rgba(150,240,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, w * 1.5, 0, 6.283); ctx.fill();
    /* face */
    ctx.fillStyle = '#123';
    var ex = 8, ey = 2, er = 3.4;
    ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 6.283); ctx.arc(ex, ey, er, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-ex + 1.2, ey - 1.2, 1.2, 0, 6.283); ctx.arc(ex + 1.2, ey - 1.2, 1.2, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#123'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, ey + 6, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawNova(x, y, radius, opts) {
    opts = opts || {};
    ctx.save();
    ctx.translate(x, y);
    var squish = opts.squish || 0;
    ctx.scale(1 + squish * 0.15, 1 - squish * 0.15);

    /* aura */
    var rg = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 2.4);
    var auraCol = opts.bomb ? '255,150,80' : '110,225,255';
    rg.addColorStop(0, 'rgba(' + auraCol + ',0.55)'); rg.addColorStop(1, 'rgba(' + auraCol + ',0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, radius * 2.4, 0, 6.283); ctx.fill();

    /* body */
    var g = ctx.createRadialGradient(-radius * 0.35, -radius * 0.4, radius * 0.2, 0, 0, radius * 1.2);
    if (opts.bomb) { g.addColorStop(0, '#ffe1a8'); g.addColorStop(0.5, '#ff9a4d'); g.addColorStop(1, '#d1542a'); }
    else { g.addColorStop(0, '#e8fdff'); g.addColorStop(0.5, '#7fdcff'); g.addColorStop(1, '#2f8fd6'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, radius, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.stroke();

    /* face */
    var look = opts.look || { x: 0, y: 0 };
    var ex = radius * 0.38, ey = -radius * 0.12, er = radius * 0.26;
    var closed = opts.blink || opts.eyes === 'happy' || opts.eyes === 'sad';
    if (opts.eyes === 'win') {
      ctx.fillStyle = '#fff';
      drawStar(0, ey, er * 1.5, er * 0.7, 5, '#fff');
    } else if (opts.eyes === 'sad') {
      ctx.strokeStyle = '#12303a'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(-ex, ey + 1, er, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey + 1, er, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else if (opts.eyes === 'happy') {
      ctx.strokeStyle = '#12303a'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(-ex, ey + 2, er, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey + 2, er, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (closed) {
      ctx.strokeStyle = '#12303a'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(-ex - er * 0.6, ey); ctx.lineTo(-ex + er * 0.6, ey); ctx.moveTo(ex - er * 0.6, ey); ctx.lineTo(ex + er * 0.6, ey); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-ex, ey, er, er * 1.15, 0, 0, 6.283); ctx.ellipse(ex, ey, er, er * 1.15, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#10303c';
      var px = look.x * er * 0.45, py = look.y * er * 0.45;
      ctx.beginPath(); ctx.arc(-ex + px, ey + py, er * 0.62, 0, 6.283); ctx.arc(ex + px, ey + py, er * 0.62, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(-ex + px - 1.5, ey + py - 1.5, er * 0.22, 0, 6.283); ctx.arc(ex + px - 1.5, ey + py - 1.5, er * 0.22, 0, 6.283); ctx.fill();
    }

    /* mouth */
    ctx.strokeStyle = '#12303a'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    if (opts.mouth === 'o') { ctx.arc(0, radius * 0.42, radius * 0.22, 0, 6.283); }
    else if (opts.mouth === 'grin') { ctx.arc(0, radius * 0.3, radius * 0.4, 0.1 * Math.PI, 0.9 * Math.PI); }
    else if (opts.mouth === 'sad') { ctx.arc(0, radius * 0.62, radius * 0.34, 1.15 * Math.PI, 1.85 * Math.PI); }
    else { ctx.arc(0, radius * 0.3, radius * 0.3, 0.15 * Math.PI, 0.85 * Math.PI); }
    ctx.stroke();

    ctx.restore();
  }

  function drawStar(cx, cy, outer, inner, points, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.beginPath();
    for (var i = 0; i < points * 2; i++) {
      var r = i % 2 === 0 ? outer : inner;
      var a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      var xx = Math.cos(a) * r, yy = Math.sin(a) * r;
      if (i === 0) { ctx.moveTo(xx, yy); } else { ctx.lineTo(xx, yy); }
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
  }

  function drawLauncher() {
    /* two forked arms */
    var base = { x: LAUNCHER.x - 26, y: LAUNCHER.y };
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(base.x, GROUND_Y + 6); ctx.lineTo(base.x, LAUNCHER.y - 60); ctx.stroke();
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(base.x, LAUNCHER.y - 50); ctx.lineTo(LAUNCHER.x - 4, LAUNCHER.y - 54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(base.x, LAUNCHER.y - 50); ctx.lineTo(LAUNCHER.x - 4, LAUNCHER.y + 54); ctx.stroke();
    /* fork tips */
    ctx.fillStyle = '#4d3419';
    ctx.beginPath(); ctx.arc(LAUNCHER.x - 4, LAUNCHER.y - 54, 7, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(LAUNCHER.x - 4, LAUNCHER.y + 54, 7, 0, 6.283); ctx.fill();
    ctx.restore();

    /* bands + nova */
    var nx = G.aim ? G.aim.x : LAUNCHER.x;
    var ny = G.aim ? G.aim.y : LAUNCHER.y + Math.sin(G.time * 2) * 3;
    var tipA = { x: LAUNCHER.x - 4, y: LAUNCHER.y - 54 };
    var tipB = { x: LAUNCHER.x - 4, y: LAUNCHER.y + 54 };
    ctx.strokeStyle = '#3a2713'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tipA.x, tipA.y); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tipB.x, tipB.y); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tipA.x, tipA.y); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tipB.x, tipB.y); ctx.lineTo(nx, ny); ctx.stroke();

    /* trajectory preview */
    if (G.aim && G.pointer.down) {
      var dir = Vector.normalise(Vector.sub({ x: LAUNCHER.x, y: LAUNCHER.y }, G.aim));
      var power = Math.min(1, Vector.magnitude(Vector.sub({ x: LAUNCHER.x, y: LAUNCHER.y }, G.aim)) / 150);
      var speed = 14 + power * 24;
      var vx = dir.x * speed, vy = dir.y * speed;
      var px = nx, py = ny;
      for (var i = 0; i < 46; i++) {
        px += vx; py += vy; vy += 1;
        if (py > GROUND_Y) { break; }
        if (i % 2 === 0) {
          ctx.globalAlpha = Math.max(0.12, 1 - i / 46);
          ctx.fillStyle = G.ammo === 'bomb' ? '#ffb15c' : '#9fe8ff';
          ctx.beginPath(); ctx.arc(px, py, 3.4 - i * 0.04, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      /* power meter */
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      rr(LAUNCHER.x - 70, LAUNCHER.y + 84, 120, 12, 6); ctx.fill();
      var pg = ctx.createLinearGradient(LAUNCHER.x - 70, 0, LAUNCHER.x + 50, 0);
      pg.addColorStop(0, '#7dffb0'); pg.addColorStop(0.6, '#ffe06b'); pg.addColorStop(1, '#ff6b6b');
      ctx.fillStyle = pg;
      rr(LAUNCHER.x - 68, LAUNCHER.y + 86, 116 * power, 8, 4); ctx.fill();
    }

    drawNova(nx, ny, 18, {
      bomb: G.ammo === 'bomb',
      blink: G.blink < 0,
      squish: G.pointer.down ? 0.4 : 0,
      look: G.pointer.down ? { x: Vector.normalise(Vector.sub(G.pointer, { x: nx, y: ny })).x, y: Vector.normalise(Vector.sub(G.pointer, { x: nx, y: ny })).y } : { x: 0.4, y: -0.2 },
      mouth: G.pointer.down ? 'o' : 'smile'
    });
  }

  function drawProjectiles() {
    for (var i = 0; i < G.projectiles.length; i++) {
      var p = G.projectiles[i];
      if (!p.gameData || !p.gameData.alive) { continue; }
      var sp = Vector.magnitude(p.velocity);
      drawNova(p.position.x, p.position.y, p.gameData.r, {
        bomb: p.gameData.bomb,
        eyes: 'happy',
        mouth: sp > 8 ? 'o' : 'grin',
        look: { x: 0.6, y: 0 }
      });
    }
  }

  function drawParticles() {
    for (var i = 0; i < G.particles.length; i++) {
      var p = G.particles[i];
      if (p.kind === 'ring') {
        ctx.globalAlpha = p.life * 0.7;
        ctx.strokeStyle = p.color; ctx.lineWidth = 4 * p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.stroke();
        ctx.globalAlpha = 1;
        continue;
      }
      if (p.kind === 'smoke') {
        ctx.globalAlpha = p.life * 0.35;
        ctx.fillStyle = p.color + (0.4 * p.life) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - p.life * 0.4), 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
      if (p.kind === 'trail') {
        ctx.globalAlpha = p.life * 0.55;
        var tg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        tg.addColorStop(0, 'rgba(' + p.color + ',' + p.life + ')');
        tg.addColorStop(1, 'rgba(' + p.color + ',0)');
        ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.kind === 'spark') {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
      } else {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === 'tri') {
          ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size, p.size); ctx.lineTo(-p.size, p.size); ctx.closePath(); ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawFloaters() {
    for (var i = 0; i < G.floaters.length; i++) {
      var f = G.floaters[i];
      ctx.globalAlpha = Math.min(1, f.life * 1.4);
      ctx.font = (f.big ? 'bold 30px' : 'bold 22px') + ' system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(f.txt, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    var th = theme();
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, view.w, view.h);
    /* letterbox bg */
    ctx.fillStyle = '#07070d';
    ctx.fillRect(0, 0, view.w, view.h);

    ctx.save();
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    /* screen shake */
    if (G.shake > 0) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }

    drawBackdrop(th);
    drawGround(th);

    for (var i = 0; i < G.blocks.length; i++) { drawBlock(G.blocks[i]); }

    drawProjectiles();
    if (G.state === 'aiming' || G.state === 'menu') { drawLauncher(); }
    else { drawLauncherStatic(); }

    drawParticles();
    drawFloaters();

    /* vignette */
    var vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.4, VW / 2, VH / 2, VH * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);

    /* white flash */
    if (G.flash > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.5) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }

    ctx.restore();
  }

  function drawLauncherStatic() {
    /* just the fork, no nova/bands */
    var base = { x: LAUNCHER.x - 26, y: LAUNCHER.y };
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(base.x, GROUND_Y + 6); ctx.lineTo(base.x, LAUNCHER.y - 60); ctx.stroke();
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(base.x, LAUNCHER.y - 50); ctx.lineTo(LAUNCHER.x - 4, LAUNCHER.y - 54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(base.x, LAUNCHER.y - 50); ctx.lineTo(LAUNCHER.x - 4, LAUNCHER.y + 54); ctx.stroke();
    ctx.restore();
  }

  /* ---------------- main loop ---------------- */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------------- boot ---------------- */
  resize();
  makeBackdrop();
  /* build a silent world for the menu backdrop */
  buildWorld(engine, 0);
  G.blocks = Composite.allBodies(world).filter(function (b) { return b.gameData && b.gameData.destructible; });
  G.state = 'menu';
  updateHUD();
  showMenu();
  requestAnimationFrame(loop);

  /* expose a few controls for debugging / automation */
  window.NovaSiege = {
    start: function (i) { startLevel(i || 0); },
    state: G,
    levels: LEVELS.length,
    destroyAllTargets: function () {
      G.blocks.forEach(function (b) { if (b.gameData && b.gameData.target && b.gameData.alive) { destroy(b); } });
    }
  };
})();
</script>
</body>
</html>
